# Default large Program-first Questioner run after the approximately 10k-row,
# 1:1 Solver/Questioner Qwen3-4B SFT. The Questioner seed pool should contain
# at least 4,096 independently certified program-first rows.
model_path: Qwen/Qwen3-4B-Instruct-2507
model_type: qwen3
response_prefix: '<think>\n\n</think>\n\n'
initial_adapter: ${INITIAL_ADAPTER}
base_tasks: ${BASE_TASKS}
questioner_seeds: ${QUESTIONER_SEEDS}
graph_snapshot: kqapro-v1
selfplay_variant: curriculum_v3
questioner_reward_variant: rule_program_question_v1
rounds: 3
questioner_episodes: 1024
solver_episodes: 2048
questioner_reward_weight: 1.0
solver_reward_weight: 1.0
opponent_samples: 4

# The large SFT establishes syntax and grounding. Program-first self-play then
# concentrates on certified frontier tasks while replay protects base behavior.
curriculum_production_rounds: 0
curriculum_grounding_rounds: 0
curriculum_solver_fraction_start: 1.0
curriculum_replay_ratio: 0.30
curriculum_question_alignment_min: 0.40
curriculum_max_seed_entities_start: 4
curriculum_max_seed_entities_end: 4
curriculum_min_archive_growth: 128
curriculum_archive_empty_policy: base_backfill
curriculum_min_solver_execution_rate: 0.10
frontier_target_start: 0.50
frontier_target_end: 0.50
frontier_sigma: 0.20

# Four opponent samples provide a useful difficulty distribution and avoid the
# binary pass-rate pathology seen in the one-sample 0.6B diagnosis.
archive_min_pass_rate: 0.15
archive_max_pass_rate: 0.85
archive_min_novelty: 0.20
archive_min_target_alignment: 0.65
base_ratio: 0.65
archive_ratio: 0.10
new_ratio: 0.25
seed: 42

# Default topology: three actor GPUs plus one independent SGLang opponent GPU.
actor_gpus: "0,1,2"
opponent_gpus: "3"
allow_gpu_overlap: false
use_vllm: true
opponent_backend: sglang
sglang_port: 30000
opponent_port: 18080
train_script: scripts/train_ms_swift_grpo.sh
sglang_start_timeout_s: 300

interaction_mode: graphscript
graphscript_version: "0.3"
relation_catalog: ${KQAPRO_RELATION_CATALOG}
relation_catalogs:
  kqapro-v1: ${KQAPRO_RELATION_CATALOG}
max_follow_limit: 100
max_edge_visits: 200
max_returned_entities: 1000
max_completion_tokens: 768
vllm_max_model_len: 16384
vllm_gpu_memory_utilization: 0.6
vllm_sleep_level: 1
deepspeed: zero2
rl_algorithm: grpo
kl_beta: 0.002
learning_rate: 7.0e-7
micro_batch_size: 1
eval_batch_size: 4
validation_samples: null
enable_grpo_validation: false
gradient_accumulation_steps: 4
steps_per_generation: 4
rollout_n: 4
save_steps: 64
save_total_limit: 4
program_profile: graphscript_v0_3
