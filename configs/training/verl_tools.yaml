tools:
  - class_name: graphtask_r1.training.verl_tools.GraphSearchTool
    config:
      max_results: 100
    tool_schema:
      type: function
      function:
        name: graph_search
        description: Traverse real graph edges adjacent to one or more entities.
        parameters:
          type: object
          properties:
            entity_ids: {type: array, description: Entity IDs to expand}
            direction: {type: string, enum: [out, in, both], description: Edge direction}
            relation_ids: {type: array, description: Optional exact relation IDs}
            limit: {type: integer, description: Maximum triples returned}
          required: [entity_ids, direction]
  - class_name: graphtask_r1.training.verl_tools.InspectEntityTool
    config: {}
    tool_schema:
      type: function
      function:
        name: inspect_entity
        description: Return the label, aliases, and types for an entity ID.
        parameters:
          type: object
          properties:
            entity_id: {type: string, description: Exact entity ID}
          required: [entity_id]
  - class_name: graphtask_r1.training.verl_tools.ExecuteProgramTool
    config: {}
    tool_schema:
      type: function
      function:
        name: execute_program
        description: Questioner-only execution of a typed candidate program; answers are hidden.
        parameters:
          type: object
          properties:
            program: {type: object, description: GraphTask typed program JSON}
          required: [program]

