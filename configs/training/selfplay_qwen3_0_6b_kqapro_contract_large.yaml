# Bounded one-GPU KQAPro curriculum run used to compare the large SFT checkpoint
# with three subsequent self-play phases on the same GraphScript v0.3 contract.
model_path: ${SMOKE_MODEL_PATH}
model_type: qwen3
response_prefix: '<think>\n\n</think>\n\n'
initial_adapter: ${INITIAL_ADAPTER}
base_tasks: ${BASE_TASKS}
val_data: ${VAL_DATA}
questioner_seeds: ${QUESTIONER_SEEDS}
graph_snapshot: kqapro-v1
selfplay_variant: curriculum_v3
rounds: 3
questioner_episodes: 64
solver_episodes: 64
curriculum_production_solver_episodes: 16
opponent_samples: 1

# Round 1 establishes valid question/program production, round 2 strengthens
# execution grounding, and round 3 selects examples near the difficulty frontier.
curriculum_production_rounds: 1
curriculum_grounding_rounds: 1
curriculum_solver_fraction_start: 0.5
curriculum_replay_ratio: 0.3
curriculum_question_alignment_min: 0.25
curriculum_max_seed_entities_start: 1
curriculum_max_seed_entities_end: 2
curriculum_min_archive_growth: 4
frontier_target_start: 0.8
frontier_target_end: 0.5
frontier_sigma: 0.25
archive_min_pass_rate: 0.0
archive_max_pass_rate: 1.0
archive_min_novelty: 0.0
base_ratio: 0.5
archive_ratio: 0.25
new_ratio: 0.25
seed: 42

# The available host has one 16-GiB GPU. Transformer opponent inference and
# actor training are sequential, so controlled overlap is safe without vLLM.
actor_gpus: "0"
opponent_gpus: "0"
allow_gpu_overlap: true
use_vllm: false
opponent_backend: transformers
opponent_device: cuda:0
opponent_port: 18080
train_script: scripts/train_ms_swift_grpo.sh

interaction_mode: graphscript
graphscript_version: "0.3"
relation_catalog: ${KQAPRO_RELATION_CATALOG}
relation_catalogs:
  kqapro-v1: ${KQAPRO_RELATION_CATALOG}
max_follow_limit: 100
max_edge_visits: 200
max_returned_entities: 1000
max_completion_tokens: 512
vllm_max_model_len: 16384
deepspeed: none
rl_algorithm: grpo
micro_batch_size: 1
eval_batch_size: 4
validation_samples: 64
gradient_accumulation_steps: 1
steps_per_generation: 4
rollout_n: 4
save_steps: 32
save_total_limit: 2
program_profile: graphscript_v0_3
