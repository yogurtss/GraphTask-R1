   </g>
   <g id="text_2">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(132.185261 79.99377)">S1</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(49.309526 89.799048)">Obtain graph snapshot, relation catalogue,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(48.634308 99.604327)">seed set, base tasks, explicit random seed,</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(90.425479 109.409605)">and execution budgets</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(370.259309 84.896409)">S2</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(283.60709 94.701687)">Jointly generate a natural-language question</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(299.428605 104.506966)">and a bounded typed graph program</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(608.333357 84.896409)">S3</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(528.926607 94.701687)">Validate and execute the graph program;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(530.169419 104.506966)">derive gold only from certified execution</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(608.333357 200.57577)">S4</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(517.449169 210.381048)">Evaluate with a frozen Solver; compute staged</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(535.281607 220.186327)">reward and gate the semantic frontier</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(567.85995 229.991605)">by interface readiness</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(370.259309 200.57577)">S5</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(297.709809 210.381048)">Admit certified tasks deterministically</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(301.658621 220.186327)">by difficulty window and structural /</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(344.595871 229.991605)">textual novelty</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(132.185261 205.478409)">S6</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(42.977589 215.283687)">Rebuild the Solver dataset in the same round;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(44.759808 225.088966)">apply easy-to-hard sampling and easy replay</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(370.259309 317.744409)">S7</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(273.29559 327.549688)">Update separate Questioner and Solver adapters;</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(294.293996 337.354966)">store replayable round state and traces</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(570.516966 317.158138)">Concrete outputs</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(552.307154 327.680875)">Verified graph-QA model</text>
    <text style="font-weight: 700; font-size: 8.8px; font-family: 'DejaVu Sans', 'Arial', 'Helvetica', sans-serif; fill: #111111" transform="translate(512.022403 338.272362)">Certified task archive + execution traces</text>
   </g>
   <g id="text_10">
