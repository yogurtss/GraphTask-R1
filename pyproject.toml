# Runtime and development dependencies live in requirements*.txt.  This file
# contains tool configuration only; GraphTask-R1 is run directly from a clone.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["graphtask_r1"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "swift", "swift.*", "verl", "verl.*", "yaml"]
ignore_missing_imports = true
